[project]
name = "curbench"
version = "1.0.0"
description = "Curriculum Learning Benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "tqdm>=4.66",
  "transformers>=4.44",
  "datasets>=2.21",
  "evaluate>=0.4",
  "einops>=0.8",
  "ogb>=1.3",
  "timm>=1.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "torchmetrics>=1.4",
  "torch-geometric>=2.7.0",
]

[tool.uv.build-backend]
module-name = "curbench"
module-root = ""

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"
