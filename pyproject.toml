[project]
name = "curbench"
version = "1.0.0"
description = "Curriculum Learning Benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "tqdm>=4.66",
  "transformers>=4.44",
  "datasets>=2.21",
  "evaluate>=0.4",
  "einops>=0.8",
  "ogb>=1.3",
  "timm>=1.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "torch==2.4.0",
  "torchvision==0.19.0",
  "torchaudio==2.4.0",
  "torchmetrics>=1.4",
  "torch-geometric==2.7.0",
  "wandb>=0.25.1",
]

[tool.uv.build-backend]
module-name = "curbench"
module-root = ""

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"
